[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vipera"
version = "0.0.1"
description = "Optimization layer for local LLM model files, so they run on weak hardware"
readme = "README.md"
requires-python = ">=3.11"   # tomllib for the hardware profiles
license = { text = "MIT" }
dependencies = []            # stdlib only — vipera must run where nothing installs easily

[project.scripts]
vipera = "vipera.cli:main"

[tool.setuptools]
packages = ["vipera", "vipera.algorithms"]
