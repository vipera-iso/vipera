name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # vipera is stdlib-only by design (`dependencies = []`), so there is
      # nothing to install — the suite runs against the checkout directly.
      - name: Byte-compile every module
        run: python -m compileall -q vipera bench tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t .
