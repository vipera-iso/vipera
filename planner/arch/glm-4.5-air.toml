# GLM-4.5-Air — a real ~100B MoE, for the "can 100B run on this laptop?" question.
#
# Values are read from the published config (zai-org/GLM-4.5-Air): 46 layers,
# hidden 4096, 128 routed experts with top-8, 1 shared expert, moe_inter 1408,
# GQA attention (96 heads / 8 kv heads / head_dim 128), vocab 151552, one MTP
# layer, 106B total / 12B active. The config's `first_k_dense_replace = 1` (the
# first layer is a dense FFN) is NOT modelled: vipera has no per-layer dense flag,
# so layer 0 is treated as routed. That is a small, one-layer approximation.
name = "glm-4.5-air"
n_layers = 46
hidden = 4096
vocab = 151552
n_experts = 128
top_k = 8
moe_inter = 1408
n_shared_experts = 1
shared_inter = 1408
kda_layers = 0
mla_layers = 0
full_layers = 46
mhc_streams = 0
mtp_layers = 1
vision_params = 0
stated_total = 106000000000
stated_active = 12000000000

[full]
n_heads = 96
n_kv_heads = 8
head_dim = 128
