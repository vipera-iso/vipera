name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "[feat]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Describe the friction, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - CLI / UX
        - HTTP API
        - Planner / hardware
        - Model manager
        - Benchmarking
        - Docs
        - Other
    validations:
      required: true
