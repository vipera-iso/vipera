name: Assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any asset exceeds 2 MB
        run: |
          set -euo pipefail
          large="$(find docs/assets -type f -size +2048k -print)"
          if [ -n "$large" ]; then
            echo "::error::assets must stay under 2 MB:"
            echo "$large"
            exit 1
          fi
          echo "all docs/assets files are under 2 MB"

      - name: Fail if a required asset is missing
        run: |
          set -euo pipefail
          for f in logo.svg logo.png banner.svg banner.png social-preview.png demo.gif; do
            test -f "docs/assets/$f" || { echo "::error::missing docs/assets/$f"; exit 1; }
          done
          echo "required assets present"
