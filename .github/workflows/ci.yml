name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Config lives in pyproject.toml ([tool.mypy] files = ["src/vipera"]).
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The coverage floor lives in pyproject.toml ([tool.coverage.report]).
      - run: pytest -q --cov=vipera --cov-report=term-missing
      - name: Smoke-test CLI
        env:
          # Windows runners default to cp1252; the CLI prints Unicode box
          # drawing, so give Python a UTF-8 stream when output is piped.
          PYTHONIOENCODING: utf-8
        run: |
          vipera --version
          vipera help
