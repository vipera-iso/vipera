name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Config lives in pyproject.toml ([tool.mypy] files = ["src/vipera"]).
      - run: mypy

  planner:
    # planner/ is a second distribution with its own pyproject.toml, so it is
    # linted and tested here with its own config. The root ruff config excludes
    # the directory; this job is what keeps it from drifting ungated, which is how
    # it accumulated ~100 findings with nothing to catch them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff pytest
      # stdlib only by design (see planner/pyproject.toml): there is nothing to
      # install, the tests import from the working directory.
      - run: ruff check vipera tests bench experiments
      # No `ruff format --check` yet: this tree predates the gateway's formatter,
      # and reformatting ~50 files belongs in its own change, not inside the
      # commit that starts gating it.
      - run: pytest

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Build the optional Rust island on every OS we test, so the fast path is
      # what the suite runs against and a broken build fails here instead of
      # silently degrading to the Python fallback after a release.
      - name: Build the Rust island
        shell: bash
        run: |
          pip install maturin
          cd gguf_rs
          maturin build --release --out ../dist-island
          cd ..
          pip install dist-island/*.whl
          python -c "import _gguf_rs; print('island ok')"
      # The coverage floor lives in pyproject.toml ([tool.coverage.report]).
      - run: pytest -q --cov=vipera --cov-report=term-missing
      # audit/ holds the 20 probes from the 1.2.0 bug audit. They stay outside
      # `testpaths` -- a failed probe there means "this is still broken", not
      # "the suite regressed" -- but they are run here: a green probe set that
      # nothing executes is a claim nobody re-checks. ~2 s.
      - run: pytest -q audit
      - name: Smoke-test CLI
        env:
          # Windows runners default to cp1252; the CLI prints Unicode box
          # drawing, so give Python a UTF-8 stream when output is piped.
          PYTHONIOENCODING: utf-8
        run: |
          vipera --version
          vipera help
