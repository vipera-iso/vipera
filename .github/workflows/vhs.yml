name: Regenerate demo GIF

on:
  push:
    branches: [main]
    paths:
      - 'docs/assets/demo.tape'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vhs, ttyd, ffmpeg, figlet, gifsicle
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt update
          # ttyd is vhs's terminal; without it the recording exits 1 at once.
          # It was missing here and the `|| true` on the record step hid that,
          # so this job has been a no-op since it was written.
          sudo apt install -y vhs ttyd ffmpeg figlet gifsicle

      - name: Install JetBrains Mono Nerd Font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fLo /tmp/JetBrainsMono.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
          unzip -q /tmp/JetBrainsMono.zip -d ~/.local/share/fonts
          fc-cache -f

      - name: Install vipera
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[llama,gguf]"
          # $GITHUB_PATH appends without clobbering the runner's system PATH
          # (the env.PATH context is empty, so prefixing PATH with it drops
          # /usr/bin and every system command — mkdir included — goes missing).
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Fetch the model the tape records
        run: |
          # The tape serves qwen2.5-1.5b-instruct-q4_k_m. Without it in the
          # registry the recording is a screenful of "model not found", which is
          # why this job used to be best-effort and the committed GIF froze at
          # whatever version happened to be installed the day it was recorded.
          vipera model search --yes

      - name: Warm the model into page cache
        run: |
          # The tape sleeps 8 s after `serve start`; a cold 1.1 GB read on a
          # CI runner is slower than that, and the GIF would record `starting`.
          vipera serve start --model qwen2.5-1.5b-instruct-q4_k_m --ctx 4096 & sleep 30
          vipera serve status || true
          vipera serve stop --yes || true

      - name: Record GIF
        # `make demo`, not bare `vhs`: the tape writes demo-raw.mp4, and the GIF
        # is the downscaled palette conversion in this target. Running vhs alone
        # left demo.gif untouched, which is the other half of why this job never
        # changed anything. No `|| true` either: a failed recording must show.
        run: make demo

      - name: Compress if needed
        run: |
          if [ -f docs/assets/demo.gif ]; then
            size_kb=$(du -k docs/assets/demo.gif | cut -f1)
            if [ "$size_kb" -gt 950 ]; then
              gifsicle -O3 --lossy=80 --colors 128 docs/assets/demo.gif -o docs/assets/demo.gif
            fi
          fi
          # The repo's own budget: `make demo` fails above 972800 bytes, and the
          # assets workflow caps every file at 2 MB. Fail here, where the
          # recording was just made, rather than let a fat GIF land.
          size=$(wc -c < docs/assets/demo.gif)
          echo "demo.gif: $size bytes"
          test "$size" -le 1024000

      - name: Commit GIF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo.gif
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "docs: auto-update demo GIF [skip ci]"
            git push
          fi
